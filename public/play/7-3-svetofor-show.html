<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Светофор-шоу</title>
<style>:root{--bg:#10142a;--tx:#f2f4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#10142a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif;text-align:center;padding:12px}
h1{margin:6px 0;font-size:1.5em}.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;max-width:900px;margin:0 auto}
.light{width:130px;background:#000;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px}
.l{width:100px;height:100px;border-radius:50%;background:#2a2a2a;transition:.3s}
.l.r.on{background:#ff3b3b;box-shadow:0 0 40px #ff3b3b}.l.y.on{background:#ffd23b;box-shadow:0 0 40px #ffd23b}.l.g.on{background:#3bff6a;box-shadow:0 0 40px #3bff6a}
.act{font-size:2.2em;font-weight:800;min-height:1.4em}.emo{font-size:5em;transition:transform .25s}
.jump{transform:translateY(-30px)}.clap{transform:scale(1.25)}
pre{text-align:left;background:#0a0d1f;border-radius:12px;padding:12px;font-size:15px;min-width:260px;color:#cfd6ff}
pre b{background:#3b4bff;color:#fff;border-radius:4px;font-weight:400}
button{background:#ff8a00;color:#fff;border:0;border-radius:12px;padding:12px 26px;font-size:18px;cursor:pointer}
.bar{height:8px;background:#222a55;border-radius:8px;max-width:600px;margin:12px auto}.bar i{display:block;height:100%;width:0;background:#3bff6a;border-radius:8px}</style></head><body>
<h1>🚦 Светофор-шоу</h1><p>Түске қарай қимыл жаса! Бағдарламаның қай жолы орындалса – сол қимыл.</p>
<div class="row"><div class="light"><div class="l r" id="r"></div><div class="l y" id="y"></div><div class="l g" id="g"></div></div>
<div><div class="emo" id="e">🧍</div><div class="act" id="a">Дайын бол!</div></div>
<pre id="c"></pre></div>
<div class="bar"><i id="p"></i></div><button id="b" onclick="run()">▶ Бастау</button>
<script>
var L=['if light == "green":','    print("Секір!")','elif light == "yellow":','    print("Қол шапалақта!")','else:','    print("Тұр!")'];
var M={green:['Секір! 🦘','🕺','jump',[0,1]],yellow:['Қол шапалақта! 👏','👏','clap',[2,3]],red:['Тұр! ✋','🧍','',[4,5]]};
function show(k){['r','y','g'].forEach(function(x){document.getElementById(x).className='l '+x});
document.getElementById({red:'r',yellow:'y',green:'g'}[k]).className+=' on';
var m=M[k];document.getElementById('a').textContent=m[0];var e=document.getElementById('e');e.textContent=m[1];e.className='emo '+m[2];
document.getElementById('c').innerHTML='light = "'+k+'"\n'+L.map(function(t,i){return m[3].indexOf(i)>-1?'<b>'+t+'</b>':t}).join('')}
L=L.map(function(t){return t+'\n'});
var T;function run(){clearTimeout(T);var seq=[],ks=['green','yellow','red'],n=18,i=0;
for(var j=0;j<n;j++){seq.push(ks[Math.floor(Math.random()*3)])}
document.getElementById('b').textContent='↻ Қайта';
function step(){if(i>=n){document.getElementById('a').textContent='Керемет! 🎉';document.getElementById('p').style.width='100%';return}
show(seq[i]);document.getElementById('p').style.width=(i+1)/n*100+'%';var d=(9-i*0.25)*1000;i++;T=setTimeout(step,d)}step()}
show('red');
</script></body></html>
