services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspaces/informatika-hub:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://ihub:ihub@db:5432/ihub
      STORAGE_DIR: ./storage
    depends_on: [db]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ihub
      POSTGRES_PASSWORD: ihub
      POSTGRES_DB: ihub
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
